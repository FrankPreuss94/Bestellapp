<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <link rel="stylesheet" href="./styles/dishes_template.css">
    <link rel="stylesheet" href="./styles/fonts.css">

    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./script.js"></script>
</head>

<body onload="renderBurgers(), renderPizzas(), renderSalads()">
    <header>
        <img class="logo_header" src="./assets/icons/Logo_Bestellapp.png" alt="Bestell App Logo">
        <img class="menu_icon" src="./assets/icons/menu.png" alt="Menu">
    </header>
    <section class="hero">
        <img class="hero_bg" src="./assets/img/hero.png" alt="Delicious pizzas and burger meals.">
        <div class="hero_infos">
            <img src="./assets/icons/logo_burger.png" alt="Burgerhouse Logo">
            <h1><span class="h1_span">Burger</span>House</h1>
            <p>The best of Burgers, Pizza and Greens, all in one great place.</p>
        </div>
    </section>
    <main>
        <section class="basket">
            <h3>Your Basket</h3>
            <div class="basket_order" id="basket_order">
                <div id="orders"></div>
                <div id="calculation"></div>
                <Button>Buy now</Button>
            </div>
        </section>

        <section class="dishes_section">
            <div class="section_head">
                <img src="./assets/icons/burger_icon.png" alt="Burger Icon">
                <h2>Burger & Sandwiches</h2>
            </div>
            <div class="dish_display" id="burger_dishes"></div>
        </section>

        <section class="dishes_section">
            <div class="section_head">
                <img src="./assets/icons/Pizza_icon.png" alt="Pizza Icon">
                <h2>Pizza (30cm)</h2>
            </div>
            <div class="dish_display" id="pizzas_dishes"></div>
        </section>

        <section class="dishes_section">
            <div class="section_head">
                <img src="./assets/icons/Salad_icon.png" alt="Salad Icon">
                <h2>Salad</h2>
            </div>
            <div class="dish_display" id="salads_dishes"></div>
        </section>
    </main>
    <footer>
        <div class="footer_lable">
            <div class="copyright">
                <img src="./assets/icons/copyright.png" alt="copyright icon">
                <p>2026 BurgerHouse</p>

            </div>
            <p>Imprint</p>
            <p>Cookie Preference</p>
        </div>
    </footer>
</body>

</html>
