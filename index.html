<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/assets.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <link rel="stylesheet" href="./styles/dishes_template.css">
    <link rel="stylesheet" href="./styles/dialog.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/media_query.css">

    <script defer src="./scripts/db.js"></script>
    <script defer src="./scripts/template.js"></script>
    <script defer src="./script.js"></script>
</head>

<body onload="renderBurgers(), renderPizzas(), renderSalads(), renderBasket()">
    <header>
        <img class="logo_header" src="./assets/icons/Logo_Bestellapp.png" alt="Bestell App Logo">
        <img class="menu_icon" src="./assets/icons/menu.png" alt="Menu">
    </header>
    <section class="hero">
        <img class="hero_bg" src="./assets/img/hero.png" alt="Delicious pizzas and burger meals.">
        <div class="hero_infos">
            <img class="burgerhouse_logo" src="./assets/icons/logo_burger.png" alt="Burgerhouse Logo">
            <div class="name_and_stars">
                <h1><span class="h1_span">Burger</span>House</h1>
                <div class="stars">
                    <img src="./assets/icons/star.png" alt="star-icon">
                    <h4>4,1</h4>
                    <p>(317)</p>
                </div>
            </div>
            <p>The best of Burgers, Pizza and Greens, all in one great place.</p>
        </div>
    </section>
    <main>
        <div class="dishes_section_wrapper">
            <div class="section_head">
                <div class="section_head_wrapper">
                    <img src="./assets/icons/burger_icon.png" alt="Burger Icon">
                    <h2>
                        <span class="desktop-text">Burger & Sandwiches</span>
                        <span class="mobile-text">Burger</span>
                    </h2>
                </div>
            </div>
            <section class="dishes_section">
                <div class="dish_display_wrapper">
                    <div class="dish_display" id="burger_dishes"></div>
                </div>
            </section>

            <section class="dishes_section">
                <div class="section_head">
                    <div class="section_head_wrapper">
                        <img src="./assets/icons/Pizza_icon.png" alt="Pizza Icon">
                        <h2>Pizza (30cm)</h2>
                    </div>
                </div>
                <div class="dish_display_wrapper">
                    <div class="dish_display" id="pizzas_dishes"></div>
                </div>
            </section>

            <section class="dishes_section">
                <div class="section_head">
                    <div class="section_head_wrapper">
                        <img src="./assets/icons/Salad_icon.png" alt="Salad Icon">
                        <h2>Salad</h2>
                    </div>
                </div>
                <div class="dish_display_wrapper">
                    <div class="dish_display" id="salads_dishes"></div>
                </div>
            </section>
            <dialog id="delivery_dialog"></dialog>
        </div>
        <div class="basket_wrapper">

            <section class="basket">
                <h3>Your Basket</h3>
                <div class="basket_order" id="basket_order">
                    <div class="orders" id="orders"></div>
                    <div class="calculation" id="calculation"></div>
                    <div class="buy_now" id="buy_now"></div>
                </div>
        </div>
        </section>
    </main>
    <footer>
        <div class="footer_lable">
            <div class="copyright">
                <img src="./assets/icons/copyright.png" alt="copyright icon">
                <p>2026 BurgerHouse</p>

            </div>
            <p>Imprint</p>
            <p>Cookie Preference</p>
        </div>
    </footer>
</body>

</html>
